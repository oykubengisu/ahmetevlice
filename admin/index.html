<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi | Prof. Dr. Ahmet Turan Evlice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <button class="theme-toggle-btn login-theme-toggle" id="theme-toggle" title="Tema Değiştir">
            <i class="fas fa-moon"></i>
            <i class="fas fa-sun"></i>
        </button>
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-user-md"></i>
                </div>
                <h1>Admin Paneli</h1>
                <p>Prof. Dr. Ahmet Turan Evlice</p>
            </div>
            
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        <span>Beni hatırla</span>
                    </label>
                </div>
                
                <button type="submit" class="btn-login">
                    <span>Giriş Yap</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                
                <div class="login-error" id="login-error">
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Kullanıcı adı veya şifre hatalı!</span>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i>
                    Siteye Dön
                </a>
            </div>
        </div>
    </div>
    
    <script src="/admin/admin.js"></script>
</body>
</html>
