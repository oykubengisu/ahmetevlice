            {
                id: 'alzheimer-evreleri',
                category: 'alzheimer',
                title: 'Alzheimer Hastalığının Evreleri Nelerdir? Tedavisi Var mı?',
                date: '2024',
                content: [
                    'Alzheimer hastalığı genellikle yavaş ilerleyen ve yıllar içinde farklı evrelerden geçen bir süreçtir. Erken evrede daha çok unutkanlık ve dikkatsizlik ön plandayken, ileri evrelerde günlük yaşam aktivitelerinde belirgin kayıplar ortaya çıkar.',
                    'Hastalığın erken döneminde kişi yeni öğrendiği bilgileri hatırlamakta zorlanır, sık kullandığı eşyaları kaybedebilir ve aynı soruyu defalarca sorabilir. Bu dönemde bağımsızlık genellikle korunur ancak yakın çevre tarafından değişiklikler fark edilmeye başlanır.',
                    'Orta evrede günlük işlerde yardıma ihtiyaç artar. Randevuları hatırlayamama, para işleriyle uğraşamama, giyinme ve yemek hazırlama gibi aktivitelerde zorlanma sık görülür. Kişilik ve davranış değişiklikleri, huzursuzluk, şüphecilik ve uyku düzeninde bozulmalar tabloya eşlik edebilir.',
                    'İleri evrede ise kişi temel ihtiyaçları için bile bakıma ihtiyaç duyar. Yürüme, beslenme, tuvalet ihtiyacı gibi en temel işlevlerde bile destek gerekir. Bu nedenle, hastalığın her evresinde hem tıbbi tedavinin hem de aile desteğinin doğru planlanması büyük önem taşır.',
                    'Mevcut tedaviler Alzheimer hastalığını tamamen ortadan kaldırmasa da, uygun ilaçlar ve yaşam tarzı düzenlemeleri ile hastalığın ilerleme hızını yavaşlatmak ve yaşam kalitesini artırmak mümkündür.'
                ]
            },
            {
                id: 'demans-nedir',
                category: 'alzheimer',
                title: 'Demans Nedir?',
                date: '2024',
                content: [
                    'Demans; yalnızca unutkanlıkla sınırlı olmayan, hafıza, dikkat, dil, planlama, karar verme ve davranış gibi pek çok bilişsel alanın etkilendiği bir klinik sendromdur.',
                    'Alzheimer hastalığı demansın en sık sebebi olmakla birlikte, damar tıkanıklıklarına bağlı vasküler demans, Lewy cisimcikli demans ve frontotemporal demans gibi farklı tipleri de bulunmaktadır.',
                    'Demans tanısı koyarken ayrıntılı hasta öyküsü, nörolojik muayene, nöropsikolojik değerlendirme ve beyin görüntüleme yöntemleri birlikte kullanılır. Bazı durumlarda kan tetkikleri ve beyin omurilik sıvısı analizleri de gerekebilir.',
                    'Erken tanı, hem hastanın hem de ailesinin geleceği daha sağlıklı planlayabilmesi, güvenli yaşam ortamının oluşturulması ve uygun tedavi seçeneklerinin zamanında başlatılabilmesi açısından kritik öneme sahiptir.'
                ]
            },
            {
                id: 'noropsikolojik-degerlendirme',
                category: 'alzheimer',
                title: 'Nöropsikolojik Değerlendirme Nedir?',
                date: '2024',
                content: [
                    'Nöropsikolojik değerlendirme; hafıza, dikkat, dil, yürütücü işlevler, görsel-uzamsal beceriler ve duygudurum gibi alanları özel testler ile inceleyen ayrıntılı bir değerlendirme yöntemidir.',
                    'Bu testler sayesinde unutkanlığın normal yaşlanmaya mı yoksa demans gibi patolojik bir sürece mi bağlı olduğu daha net şekilde ortaya konabilir.',
                    'Ayrıca Parkinson hastalığı, inme, travmatik beyin hasarı ve epilepsi gibi nörolojik hastalıklarda görülen bilişsel değişiklikler de nöropsikolojik testler ile ayrıntılı biçimde değerlendirilebilir.',
                    'Test sonuçları, tanı koymanın yanı sıra tedavi ve rehabilitasyon planlarının kişiye özel hazırlanmasına da yardımcı olur.'
                ]
            },
            {
                id: 'parkinson',
                category: 'parkinson',
                title: 'Parkinson Hastalığı',
                date: '2024',
                content: [
                    'Parkinson hastalığı; titreme, kaslarda katılık, hareketlerde yavaşlama ve denge bozukluğu ile seyreden, beyin dopamin sistemini etkileyen ilerleyici bir nörolojik hastalıktır.',
                    'Hastalığın erken döneminde tek tarafta başlayan titreme, yazının küçülmesi, yüz mimiklerinde azalma ve koku duyusunda azalma gibi belirtiler görülebilir.',
                    'Uygun ilaç tedavileri ile hastaların uzun yıllar bağımsız ve aktif bir yaşam sürmesi mümkündür. İlaç tedavisine ek olarak düzenli egzersiz, denge çalışmaları ve gerektiğinde konuşma terapisi de tedavinin önemli parçalarıdır.'
                ]
            },
            {
                id: 'multipl-skleroz',
                category: 'diger',
                title: 'Multipl Skleroz (MS)',
                date: '2024',
                content: [
                    'Multipl Skleroz (MS), bağışıklık sisteminin merkezi sinir sistemine saldırması sonucu ortaya çıkan, ataklarla seyreden veya yavaş ilerleyen bir nörolojik hastalıktır.',
                    'Görme kaybı, dengesizlik, uyuşma, güçsüzlük, idrar sorunları ve yorgunluk en sık görülen belirtiler arasındadır.',
                    'Erken tanı ve uygun hastalık modifiye edici tedaviler ile atak sayısını azaltmak ve sakatlık gelişimini yavaşlatmak mümkündür.'
                ]
            },
            {
                id: 'myasthenia-gravis',
                category: 'diger',
                title: 'Myasthenia Gravis',
                date: '2024',
                content: [
                    'Myasthenia Gravis, kasların sinir uyarısına verdiği yanıtın bozulduğu, gün içinde artan kas güçsüzlüğü ile karakterize otoimmün bir hastalıktır.',
                    'Göz kapaklarında düşme, çift görme, çiğneme ve yutma güçlüğü, konuşmada burunlu konuşma ve kol-bacaklarda çabuk yorulma en sık belirtilerdir.',
                    'Tanıda klinik muayene, kan testleri, sinir-kas iletim testleri ve bazen tek lif EMG’den yararlanılır. Uygun ilaç tedavileri ve immünolojik yöntemlerle hastalar genellikle iyi bir yaşam kalitesine ulaşabilir.'
                ]
            },
            {
                id: 'kas-hastaliklari',
                category: 'diger',
                title: 'Kas Hastalıkları ve Miyopatiler',
                date: '2024',
                content: [
                    'Kas hastalıkları; doğuştan gelen ya da sonradan ortaya çıkan, kas güçsüzlüğü ve erimesi ile seyreden geniş bir hastalık grubudur.',
                    'Hastalar merdiven çıkma, yokuş tırmanma, kollarını yukarı kaldırma ve uzun süre yürüme gibi aktivitelerde çabuk yorulma ve zorlanma tarif edebilir.',
                    'Tanıda EMG, kan tetkikleri, genetik analizler ve gerektiğinde kas biyopsisi kullanılır. Altta yatan nedene göre tedavi ve rehabilitasyon programı planlanır.'
                ]
            },
            {
                id: 'bas-agrisi',
                category: 'bas-agrisi',
                title: 'Baş Ağrısı Nedir? Ne Zaman Ciddiye Alınmalı?',
                date: '2024',
                content: [
                    'Baş ağrısı, toplumda en sık görülen nörolojik yakınmalardan biridir ve her baş ağrısı ciddi bir hastalık anlamına gelmez.',
                    'Ancak ani başlayan, çok şiddetli, beraberinde konuşma bozukluğu, kol-bacakta güçsüzlük, görme kaybı veya bilinç bulanıklığı gibi bulguların eşlik ettiği baş ağrıları acil değerlendirme gerektirir.',
                    'Migren, gerilim tipi baş ağrısı ve küme tipi baş ağrısı gibi primer baş ağrılarında ayrıntılı öykü ve doğru tanı, etkin tedavinin temelini oluşturur.'
                ]
            },
            {
                id: 'agri-blokaji',
                category: 'agri',
                title: 'Ağrı Blokajı Nedir?',
                date: '2024',
                content: [
                    'Ağrı blokajı, özellikle kronik ağrılarda belirli sinirlerin veya sinir köklerinin ilaçlarla geçici olarak bloke edilmesi esasına dayanan girişimsel bir tedavi yöntemidir.',
                    'Baş ağrısı, boyun ve bel ağrıları, nevraljiler ve bazı kas spazmlarında uygun hastalarda ağrı blokajı ile belirgin rahatlama sağlanabilir.',
                    'İşlem genellikle kısa sürer ve çoğu zaman aynı gün içinde hasta günlük yaşamına dönebilir.'
                ]
            },
            {
                id: 'botox-migren',
                category: 'botoks',
                title: 'Migren Tedavisinde Botoks Uygulamaları',
                date: '2024',
                content: [
                    'Kronik migren; ayda 15 günden fazla baş ağrısı ataklarının görüldüğü, yaşam kalitesini ciddi şekilde bozan bir durumdur.',
                    'Bu hastalarda, belirli aralıklarla yapılan botulinum toksin (Botoks) enjeksiyonları atak sıklığını ve şiddetini azaltmada etkili olabilir.',
                    'Uygulama sırasında alın, şakak, ense ve boyun bölgesine çok ince iğnelerle belirli noktalara enjeksiyon yapılır ve işlem birkaç dakikada tamamlanır.'
                ]
            },
            {
                id: 'uyku-apnesi',
                category: 'uyku',
                title: 'Uyku Apnesi Nedir?',
                date: '2024',
                content: [
                    'Uyku apnesi; uykuda solunumun tekrar tekrar durup yeniden başladığı, gürültülü horlama ve gündüz aşırı uykululuk ile seyreden bir uyku bozukluğudur.',
                    'Tedavi edilmeyen uyku apnesi; hipertansiyon, kalp hastalıkları, inme ve diyabet riskini artırabilir.',
                    'Tanıda polisomnografi (uyku testi) altın standarttır ve sonuçlara göre CPAP tedavisi, yaşam tarzı değişiklikleri veya diğer yöntemler planlanır.'
                ]
            },
            {
                id: 'insomnia',
                category: 'uyku',
                title: 'İnsomnia (Uykusuzluk) Nedir?',
                date: '2024',
                content: [
                    'İnsomnia; uykuya dalmada güçlük, uykuyu sürdürememe veya sabah çok erken uyanma ile kendini gösteren, kişinin gün içi işlevselliğini bozan bir uyku bozukluğudur.',
                    'Nedenleri arasında stres, kaygı bozuklukları, depresyon, kronik ağrı, ilaç kullanımı ve uyku hijyenine ait hatalar sayılabilir.',
                    'Tedavide yalnızca ilaçlara değil, uyku hijyeni eğitimi ve bilişsel-davranışçı yaklaşımlara da önem verilmelidir.'
                ]
            },
            {
                id: 'narkolepsi',
                category: 'uyku',
                title: 'Narkolepsi ve Diğer Nadir Uyku Bozuklukları',
                date: '2024',
                content: [
                    'Narkolepsi; gün içinde aniden ve kontrolsüz şekilde uyku ataklarının ortaya çıktığı, nadir görülen bir uyku hastalığıdır.',
                    'Bazı hastalarda gülme veya ani duygusal değişikliklerle birlikte kaslarda anlık güçsüzlük (katapleksi) de görülebilir.',
                    'Tanıda gece uykusu ve gündüz çoklu uyku latansı testi (MSLT) birlikte değerlendirilir ve uygun ilaç tedavileri ile ataklar kontrol altına alınmaya çalışılır.'
                ]
            },
            {
                id: 'epilepsi',
                category: 'epilepsi',
                title: 'Epilepsi Nedir?',
                date: '2024',
                content: [
                    'Epilepsi; beynin anormal elektriksel boşalımları sonucu ortaya çıkan, tekrar eden nöbetlerle karakterize bir hastalıktır.',
                    'Nöbetler; dalma, boş bakma, kasılma, bilinç kaybı, kol-bacak seğirmeleri, aniden yere düşme gibi çok farklı şekillerde görülebilir.',
                    'Tanıda ayrıntılı öykü, EEG ve beyin görüntüleme yöntemleri kullanılır. Uygun ilaç tedavileri ile hastaların büyük çoğunluğunda nöbetler kontrol altına alınabilir.'
                ]
            },
            {
                id: 'eeg',
                category: 'epilepsi',
                title: 'EEG (Elektroensefalografi) Nedir?',
                date: '2024',

                    'EEG; beynin elektriksel aktivitesini kayıt altına alan, ağrısız ve yan etkisi olmayan bir tetkiktir.',
                    'Epilepsi tanısı ve tedavi takibinde, ayrıca bazı bilinç bozukluğu ve uyku bozukluğu durumlarında EEG önemli bilgiler sağlar.',
                    'İşlem sırasında saçlı deriye yerleştirilen elektrotlar aracılığıyla beyin dalgaları kaydedilir ve uzman hekim tarafından değerlendirilir.'
                ]
            },
            {
                id: 'emg',
                category: 'diger',
                title: 'EMG (Elektromiyografi) Nedir?',
                date: '2024',

                    'EMG; kas ve sinirlerin elektriksel aktivitelerini ölçerek periferik sinir hastalıkları, kök basıları, kas hastalıkları ve sinir-kas kavşağı hastalıklarının tanısında kullanılan bir testtir.',
                    'İletim çalışmaları ve iğne EMG aşamalarından oluşur. İşlem sırasında hafif rahatsızlık hissi olabilir ancak genellikle iyi tolere edilir.',

            {
                id: 'vertigo',
                category: 'diger',

                    'Baş dönmesi şikayeti; dengesizlik, çift görme, konuşma bozukluğu, kol-bacak güçsüzlüğü gibi bulgularla birlikteyse acil nörolojik değerlendirme gerektirir.'

            },
            {
                id: 'inme',
                category: 'inme',
                title: 'İnme (Felç) Belirtileri ve Acil Müdahale',

                    'Bu belirtiler ortaya çıktığında zaman kaybetmeden acil servise başvurmak, pıhtı çözücü tedaviler gibi hayat kurtarıcı müdahalelere imkan tanır.'
                ]
            },
            {
                id: 'posterior-cortical-atrophy',
                category: 'alzheimer',
                title: 'Posterior Kortikal Atrofi Nedir?',
                date: '2024',
                content: [
                    'Posterior kortikal atrofi; görsel-uzamsal algı ve okuma, yazma, nesneleri tanıma gibi işlevleri bozan, nadir görülen bir demans alt tipidir.',

                    'Güncel tedaviler hastalığı tamamen durdurmasa da ilerlemeyi yavaşlatmayı ve yaşam kalitesini artırmayı hedefler. Multidisipliner yaklaşım, solunum ve beslenme desteği bu süreçte büyük önem taşır.'

        ];

        function getArticleById(id) {
            return staticArticles.find(a => a.id === id);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const headerContainer = document.getElementById('article-header-container');
            const root = document.getElementById('article-content-root');

            const article = id ? getArticleById(id) : null;

            if (!article) {
                headerContainer.innerHTML = `
                    <div class="not-found">
                        <i class="fas fa-file-alt"></i>
                        <h2>Blog yazısı bulunamadı</h2>
                        <p>Aradığınız içerik kaldırılmış veya henüz eklenmemiş olabilir.</p>
                        <a href="/blog" class="btn btn-primary" style="margin-top: 16px;">
                            <span>Tüm Blog Yazılarına Dön</span>
                        </a>
                    </div>
                `;
                return;
            }

            const cfg = categoryConfig[article.category] || categoryConfig.genel;
            const catName = categoryNames[article.category] || 'Genel';

            headerContainer.innerHTML = `
                <a href="/blog?category=${article.category}" class="back-to-blog">
                    <i class="fas fa-arrow-left"></i>
                    <span>Bloga Dön</span>
                </a>
                <div>
                    <span class="blog-article-category">
                        <i class="fas ${cfg.icon}" style="margin-right: 6px;"></i>
                        ${catName}
                    </span>
                    <h1 class="blog-article-title">${article.title}</h1>
                    <div class="blog-article-meta">
                        <span><i class="fas fa-calendar-alt"></i>${article.date}</span>
                    </div>
                </div>
            `;

            root.innerHTML = `
                <div class="blog-article-content-wrapper">
                    ${article.content.map(p => `<p>${p}</p>`).join('')}
                </div>
            `;
        });
    </script>
</body>
</html>
